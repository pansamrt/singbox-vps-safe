name: Phase 1 static checks

on:
  push:
    branches: ["security/**", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n scripts/install.sh scripts/sb.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/install.sh scripts/sb.sh
      - name: Block obvious destructive installer commands
        run: |
          if grep -En 'iptables[[:space:]].*(-F|-X|-P)|ufw[[:space:]]+disable|setenforce[[:space:]]+0|systemctl[[:space:]]+(stop|disable)[[:space:]]+(ssh|sshd|apache|firewalld|warp)' scripts/install.sh; then
            echo "Unsafe command found in installer" >&2
            exit 1
          fi
      - name: Python protocol-generator unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax check
        run: python3 -m py_compile scripts/generate_config.py scripts/state.py scripts/update.py
      - name: Require explicit confirmation and prohibit scheduled upgrades
        run: |
          grep -Fq -- '--update requires --confirm' scripts/update.py
          grep -Fq -- 'UPDATE AVAILABLE. Manual confirmation is required' scripts/update.py
          if grep -En 'curl.*\|[[:space:]]*(ba)?sh|--insecure|ufw disable|iptables -F|ssh .*@|systemctl (stop|disable) (ssh|sshd)' scripts/update.py; then
            echo "Unsafe operation or remote deploy pattern in updater" >&2
            exit 1
          fi
      - name: Validate generated protocols using pinned sing-box v1.14.4
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION=1.14.4
          ASSET="sing-box-${VERSION}-linux-amd64"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/${ASSET}.tar.gz"
          curl -fL --retry 2 --proto '=https' --tlsv1.2 "$URL" -o "$RUNNER_TEMP/core.tar.gz"
          printf '%s  %s\n' '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968' "$RUNNER_TEMP/core.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/core.tar.gz" -C "$RUNNER_TEMP" "$ASSET/sing-box"
          BIN="$RUNNER_TEMP/$ASSET/sing-box"
          "$BIN" version
          sudo mkdir -p /etc/singbox-vps-safe
          sudo openssl req -new -x509 -days 1 -nodes -newkey rsa:2048 \
            -subj '/CN=example.org' \
            -keyout /etc/singbox-vps-safe/key.pem \
            -out /etc/singbox-vps-safe/cert.pem >/dev/null 2>&1
          for proto in hysteria2 tuic anytls; do
            python3 scripts/generate_config.py \
              --protocol "$proto" --port 53545 \
              --server-name example.org \
              --tls-cert /etc/singbox-vps-safe/cert.pem \
              --tls-key /etc/singbox-vps-safe/key.pem \
              --output "$RUNNER_TEMP/$proto.json"
            sudo "$BIN" check -c "$RUNNER_TEMP/$proto.json"
          done
          python3 scripts/generate_config.py \
            --protocol vless-reality --port 53546 \
            --handshake-host www.example.org \
            --reality-binary "$BIN" \
            --output "$RUNNER_TEMP/vless-reality.json"
          sudo "$BIN" check -c "$RUNNER_TEMP/vless-reality.json"
      - name: Verify source attribution exists
        run: |
          test -s LICENSE
          grep -Fq 'yonggekkk/sing-box-yg' SECURITY.md
